[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bearings"
version = "0.2.0"
description = "Get your bearings in unfamiliar source data: a local data-modelling workbench (DuckDB + web UI) for searching, profiling, sampling and relating CSV/Parquet exports."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Flyingbear", email = "flyingbearhk@users.noreply.github.com" }]
requires-python = ">=3.10"
keywords = ["data-modelling", "data-profiling", "duckdb", "data-catalog", "databricks", "cdm", "fastapi"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "Topic :: Database",
  "Intended Audience :: Developers",
]
dependencies = [
  "duckdb>=1.1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "typer>=0.12",
  "rapidfuzz>=3.6",
  "openpyxl>=3.1",
  "pytz>=2024.1",    # DuckDB needs it to return TIMESTAMP WITH TIME ZONE values (e.g. tables pulled from Databricks)
]

[project.optional-dependencies]
# Remote mode: connect to Azure Databricks (Unity Catalog metadata sync, remote profiling,
# pass-through queries). Install with:  uv sync --extra databricks
databricks = [
  "databricks-sdk>=0.40",            # browser OAuth (Entra ID), Unity Catalog REST API
  "databricks-sql-connector>=3.4",   # SQL warehouse queries, Arrow results
  "pyarrow>=14",                     # Arrow -> DuckDB for `bearings pull`
  "sqlglot>=25",                     # DuckDB -> Databricks SQL dialect translation
  "tomli>=2; python_version < '3.11'",  # reading ~/.bearings/connections.toml on Python 3.10
]

[project.urls]
Homepage = "https://github.com/flyingbearhk/bearings"
Issues = "https://github.com/flyingbearhk/bearings/issues"

[dependency-groups]
dev = [
  "httpx>=0.27",   # FastAPI TestClient
  "pytest>=8",
]

[project.scripts]
bearings = "bearings.cli:app"
dm = "bearings.cli:app"   # short alias

[tool.setuptools]
packages = ["bearings"]

[tool.setuptools.package-data]
bearings = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  # noise from FastAPI's TestClient on newer Starlette / anyio – not from Bearings
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]
